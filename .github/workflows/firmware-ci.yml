name: firmware-ci

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential ninja-build cmake python3
      - name: Configure host tests
        run: cmake -S . -B build/host -G Ninja -DBMS_HOST_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build host tests
        run: cmake --build build/host
      - name: Run host tests
        run: ctest --test-dir build/host --output-on-failure

  gcc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [gcc-debug, gcc-release, gcc-engineering]
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GCC and build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi ninja-build cmake python3
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Host contract tests
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
