name: BMS V2 CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - refactor/bms-v2-safety-architecture

permissions:
  contents: read

concurrency:
  group: bms-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-and-host-tests:
    name: Policy and host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Protect generated and vendor sources
        run: python3 tools/ci/check_generated_unchanged.py --base origin/main

      - name: Check architecture restrictions
        run: python3 tools/ci/check_forbidden_patterns.py

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang-format \
            clang-tidy \
            cppcheck \
            ninja-build

      - name: Check C formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          files = sorted(
              str(path)
              for root in (Path("firmware"), Path("tests"))
              for path in root.rglob("*")
              if path.is_file() and path.suffix in {".c", ".h"}
          )
          if not files:
              raise SystemExit("No BMS V2 C source files found")
          subprocess.run(
              ["clang-format", "--dry-run", "--Werror", *files],
              check=True,
          )
          PY

      - name: Configure host tests
        run: |
          cmake \
            -S tests \
            -B build/host \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build host tests
        run: cmake --build build/host --parallel

      - name: Run host tests
        run: ctest --test-dir build/host --output-on-failure

      - name: Configure sanitizer tests
        run: |
          cmake \
            -S tests \
            -B build/sanitize \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build sanitizer tests
        run: cmake --build build/sanitize --parallel

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/sanitize --output-on-failure

      - name: Run clang-tidy on domain logic
        run: |
          clang-tidy \
            -p build/host \
            firmware/domain/bms_fault.c \
            firmware/domain/bms_safety.c

      - name: Run cppcheck on BMS V2 sources
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --std=c11 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            -Ifirmware/common \
            -Ifirmware/domain \
            firmware/common \
            firmware/domain

  target-build:
    name: STM32 GCC target build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-arm-none-eabi \
            ninja-build

      - name: Configure Debug firmware
        run: cmake --preset gcc-debug

      - name: Build Debug firmware
        run: cmake --build --preset gcc-debug --parallel

      - name: Configure Release firmware
        run: cmake --preset gcc-release

      - name: Build Release firmware
        run: cmake --build --preset gcc-release --parallel
